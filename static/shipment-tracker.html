<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipment Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1923;
    --navy-mid: #1C2B3A;
    --amber: #E8A020;
    --amber-light: #FFF3DC;
    --white: #FFFFFF;
    --surface: #F6F8FA;
    --border: #E2E8F0;
    --text: #0F1923;
    --text-muted: #64748B;
    --green: #10B981;
    --green-bg: #D1FAE5;
    --blue: #3B82F6;
    --blue-bg: #DBEAFE;
    --red: #EF4444;
    --red-bg: #FEE2E2;
    --pending-bg: #FFF3DC;
    --pending: #B45309;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: var(--navy);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--white);
    letter-spacing: -0.3px;
  }
  .nav-logo span { color: var(--amber); }
  .nav-meta {
    font-size: 12px;
    color: #64748B;
  }

  /* LAYOUT */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 56px);
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    position: sticky;
    top: 0;
    height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .sidebar h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  input, select, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--white);
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(232,160,32,0.12);
  }
  textarea { resize: vertical; min-height: 64px; }

  .btn-primary {
    width: 100%;
    padding: 10px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--navy-mid); }

  .success-msg {
    background: var(--green-bg);
    color: #065F46;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 12px;
    display: none;
  }
  .error-msg {
    background: var(--red-bg);
    color: #991B1B;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 12px;
    display: none;
  }

  /* MAIN */
  .main {
    padding: 28px 32px;
  }
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .main-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.4px;
  }
  .shipment-count {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filters input, .filters select {
    width: auto;
    flex: 1;
    min-width: 140px;
    font-size: 13px;
    padding: 8px 12px;
  }
  .btn-filter {
    padding: 8px 16px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .btn-clear {
    padding: 8px 16px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  /* SHIPMENT CARDS */
  .shipments-list { display: flex; flex-direction: column; gap: 10px; }

  .shipment-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
    transition: box-shadow 0.15s;
  }
  .shipment-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

  .ship-tracking {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .ship-route {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .ship-route strong { color: var(--text); font-weight: 500; }
  .ship-carrier {
    font-size: 12px;
    color: var(--text-muted);
  }
  .ship-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    font-style: italic;
  }

  .ship-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }
  .status-pending    { background: var(--pending-bg); color: var(--pending); }
  .status-in-transit { background: var(--blue-bg); color: #1D4ED8; }
  .status-delivered  { background: var(--green-bg); color: #065F46; }
  .status-delayed    { background: var(--red-bg); color: #991B1B; }
  .status-default    { background: var(--surface); color: var(--text-muted); }

  .ship-actions { display: flex; gap: 6px; }
  .btn-status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--white);
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
  }
  .btn-status:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .btn-delete {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid #FCA5A5;
    background: var(--white);
    cursor: pointer;
    color: var(--red);
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
  }
  .btn-delete:hover { background: var(--red); color: var(--white); border-color: var(--red); }

  .ship-date {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* STATUS UPDATE DROPDOWN */
  .status-select-inline {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    background: var(--white);
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">CARGO<span>TRACK</span></div>
  <div class="nav-meta">Connected to localhost:8000</div>
</nav>

<div class="layout">

  <!-- SIDEBAR: Add Shipment -->
  <aside class="sidebar">
    <h2>New Shipment</h2>
    <form id="shipmentForm">
      <div class="form-group">
        <label>Tracking Number</label>
        <input type="text" id="tracking_number" placeholder="e.g. MAERSK-2024-001" required>
      </div>
      <div class="form-group">
        <label>Origin Country</label>
        <input type="text" id="origin_country" placeholder="e.g. China" required>
      </div>
      <div class="form-group">
        <label>Destination Country</label>
        <input type="text" id="destination_country" placeholder="e.g. United States" required>
      </div>
      <div class="form-group">
        <label>Carrier</label>
        <input type="text" id="carrier" placeholder="e.g. Maersk, DHL, FedEx" required>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="status">
          <option value="Pending">Pending</option>
          <option value="In Transit">In Transit</option>
          <option value="Delivered">Delivered</option>
          <option value="Delayed">Delayed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description (optional)</label>
        <textarea id="description" placeholder="e.g. Electronics components, Q4 inventory..."></textarea>
      </div>
      <button type="submit" class="btn-primary">Add Shipment</button>
      <div class="success-msg" id="successMsg">Shipment added successfully!</div>
      <div class="error-msg" id="errorMsg">Something went wrong. Check the API is running.</div>
    </form>
  </aside>

  <!-- MAIN: Shipment List -->
  <main class="main">
    <div class="main-header">
      <div>
        <h1>Shipments</h1>
        <div class="shipment-count" id="shipmentCount">Loading...</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="filterOrigin" placeholder="Origin country">
      <input type="text" id="filterDest" placeholder="Destination country">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Transit">In Transit</option>
        <option value="Delivered">Delivered</option>
        <option value="Delayed">Delayed</option>
      </select>
      <button class="btn-filter" onclick="loadShipments()">Filter</button>
      <button class="btn-clear" onclick="clearFilters()">Clear</button>
    </div>

    <div id="shipmentsList" class="shipments-list">
      <div class="loading">Loading shipments...</div>
    </div>
  </main>
</div>

<script>
const API = 'http://127.0.0.1:8001';

function statusClass(status) {
  const s = (status || '').toLowerCase().replace(' ', '-');
  if (s === 'pending') return 'status-pending';
  if (s === 'in-transit') return 'status-in-transit';
  if (s === 'delivered') return 'status-delivered';
  if (s === 'delayed') return 'status-delayed';
  return 'status-default';
}

function formatDate(dt) {
  if (!dt) return '';
  return new Date(dt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

async function loadShipments() {
  const origin = document.getElementById('filterOrigin').value;
  const dest = document.getElementById('filterDest').value;
  const status = document.getElementById('filterStatus').value;

  let url = `${API}/shipments/?limit=100`;
  if (origin) url += `&origin_country=${encodeURIComponent(origin)}`;
  if (dest) url += `&destination_country=${encodeURIComponent(dest)}`;
  if (status) url += `&status=${encodeURIComponent(status)}`;

  const list = document.getElementById('shipmentsList');
  list.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(url);
    const data = await res.json();

    document.getElementById('shipmentCount').textContent =
      `${data.length} shipment${data.length !== 1 ? 's' : ''}`;

    if (data.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📦</div>
          <p>No shipments found. Add one using the form.</p>
        </div>`;
      return;
    }

    list.innerHTML = data.map(s => `
      <div class="shipment-card" id="card-${s.id}">
        <div>
          <div class="ship-tracking">${s.tracking_number}</div>
          <div class="ship-route">
            <strong>${s.origin_country}</strong> → <strong>${s.destination_country}</strong>
          </div>
          <div class="ship-carrier">Carrier: ${s.carrier}</div>
          ${s.description ? `<div class="ship-desc">${s.description}</div>` : ''}
        </div>
        <div class="ship-right">
          <span class="status-badge ${statusClass(s.status)}">${s.status}</span>
          <div class="ship-actions">
            <select class="status-select-inline" onchange="updateStatus(${s.id}, this.value)">
              <option value="">Update status</option>
              <option value="Pending">Pending</option>
              <option value="In Transit">In Transit</option>
              <option value="Delivered">Delivered</option>
              <option value="Delayed">Delayed</option>
            </select>
            <button class="btn-delete" onclick="deleteShipment(${s.id})">Delete</button>
          </div>
          <div class="ship-date">${formatDate(s.created_at)}</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>Cannot connect to API. Make sure uvicorn is running.</p>
      </div>`;
    document.getElementById('shipmentCount').textContent = '';
  }
}

async function updateStatus(id, status) {
  if (!status) return;
  try {
    await fetch(`${API}/shipments/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    loadShipments();
  } catch (e) {
    alert('Failed to update status.');
  }
}

async function deleteShipment(id) {
  if (!confirm('Delete this shipment?')) return;
  try {
    await fetch(`${API}/shipments/${id}`, { method: 'DELETE' });
    loadShipments();
  } catch (e) {
    alert('Failed to delete shipment.');
  }
}

function clearFilters() {
  document.getElementById('filterOrigin').value = '';
  document.getElementById('filterDest').value = '';
  document.getElementById('filterStatus').value = '';
  loadShipments();
}

document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const successMsg = document.getElementById('successMsg');
  const errorMsg = document.getElementById('errorMsg');
  successMsg.style.display = 'none';
  errorMsg.style.display = 'none';

  const body = {
    tracking_number: document.getElementById('tracking_number').value,
    origin_country: document.getElementById('origin_country').value,
    destination_country: document.getElementById('destination_country').value,
    carrier: document.getElementById('carrier').value,
    status: document.getElementById('status').value,
    description: document.getElementById('description').value || null,
  };

  try {
    const res = await fetch(`${API}/shipments/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error();
    successMsg.style.display = 'block';
    document.getElementById('shipmentForm').reset();
    loadShipments();
    setTimeout(() => successMsg.style.display = 'none', 3000);
  } catch (e) {
    errorMsg.style.display = 'block';
  }
});

loadShipments();
</script>
</body>
</html>
